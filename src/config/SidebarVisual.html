<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sidebar per Role - Aplikasi Sekolah</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css"
    />
    <style>
      :root {
        --bg: #f7f6f2;
        --card: #ffffff;
        --border: #e2e0d8;
        --border-strong: #c9c6ba;
        --text-primary: #26221c;
        --text-secondary: #6b6759;
        --text-muted: #99958a;
        --accent-bg: #e6f1fb;
        --accent-text: #0c447c;
        --accent-border: #378add;
        --success-bg: #eaf3de;
        --success-text: #27500a;
        --warning-bg: #faeeda;
        --warning-text: #854f0b;
        --radius: 8px;
        --sidebar-w: 268px;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text-primary);
      }

      /* ── App shell ── */
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ── Sidebar ── */
      .sidebar {
        width: var(--sidebar-w);
        flex-shrink: 0;
        background: var(--card);
        border-right: 0.5px solid var(--border);
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      .sidebar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 18px 16px;
        border-bottom: 0.5px solid var(--border);
        flex-shrink: 0;
      }
      .sidebar-brand .logo {
        width: 34px;
        height: 34px;
        border-radius: 9px;
        background: linear-gradient(135deg, var(--accent-border), var(--accent-text));
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 17px;
        flex-shrink: 0;
      }
      .sidebar-brand .txt div:first-child {
        font-size: 14px;
        font-weight: 700;
        line-height: 1.2;
      }
      .sidebar-brand .txt div:last-child {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      .sidebar-nav {
        flex: 1;
        overflow-y: auto;
        padding: 12px 10px 16px;
      }
      .sidebar-footer {
        flex-shrink: 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-top: 0.5px solid var(--border);
      }
      .sidebar-footer .avatar {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--accent-bg);
        color: var(--accent-text);
        font-size: 12px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .sidebar-footer .txt div:first-child {
        font-size: 12.5px;
        font-weight: 600;
      }
      .sidebar-footer .txt div:last-child {
        font-size: 11px;
        color: var(--text-muted);
      }

      .group-head {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 700;
        color: var(--text-muted);
        margin: 18px 0 6px;
        padding: 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .group-head:first-child {
        margin-top: 2px;
      }
      .group-head i.warn {
        margin-left: auto;
        color: var(--warning-text);
        font-size: 13px;
      }
      .item-row {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 8px 9px;
        margin: 1px 0;
        font-size: 13.5px;
        border-radius: 7px;
        color: var(--text-primary);
        cursor: pointer;
        border: 1px solid transparent;
        transition:
          background 0.12s,
          color 0.12s;
      }
      .item-row:hover {
        background: #f1efe8;
      }
      .item-row i {
        font-size: 16px;
        flex-shrink: 0;
        color: var(--text-muted);
        width: 16px;
        text-align: center;
      }
      .item-row.active {
        background: var(--accent-bg);
        color: var(--accent-text);
        font-weight: 600;
      }
      .item-row.active i {
        color: inherit;
      }
      .item-row.plus:not(.active) {
        background: var(--accent-bg);
        color: var(--accent-text);
      }
      .item-row.plus:not(.active) i {
        color: inherit;
      }
      .badge {
        margin-left: auto;
        font-size: 9.5px;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 6px;
        flex-shrink: 0;
        text-transform: uppercase;
        letter-spacing: 0.02em;
      }
      .badge-new {
        background: var(--accent-border);
        color: #fff;
      }
      .item-row.active .badge-new {
        background: var(--accent-text);
      }
      .badge-plan {
        background: var(--warning-bg);
        color: var(--warning-text);
      }

      /* ── Main column ── */
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .topbar {
        height: 62px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 0 24px;
        background: var(--card);
        border-bottom: 0.5px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 5;
      }
      .breadcrumb {
        font-size: 13px;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
      }
      .breadcrumb strong {
        color: var(--text-primary);
        font-weight: 700;
        font-size: 14.5px;
        white-space: nowrap;
      }
      .breadcrumb span.sep {
        color: var(--border-strong);
      }
      .breadcrumb span.crumb {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #role-tabs {
        display: flex;
        flex-wrap: nowrap;
        gap: 6px;
        overflow-x: auto;
        max-width: 56vw;
        padding-bottom: 2px;
      }
      #role-tabs::-webkit-scrollbar {
        height: 4px;
      }
      #role-tabs button {
        font-size: 12.5px;
        padding: 6px 12px;
        border-radius: 999px;
        border: 0.5px solid var(--border-strong);
        background: var(--card);
        color: var(--text-primary);
        cursor: pointer;
        font-family: inherit;
        white-space: nowrap;
        flex-shrink: 0;
        transition: 0.12s;
      }
      #role-tabs button:hover {
        background: #f0efe9;
      }
      #role-tabs button.active {
        background: var(--accent-text);
        color: #fff;
        border-color: var(--accent-text);
        font-weight: 600;
      }

      .content {
        flex: 1;
        padding: 24px;
      }
      .page-head {
        margin-bottom: 18px;
      }
      .page-head h2 {
        margin: 0 0 4px;
        font-size: 19px;
        font-weight: 700;
      }
      .page-head p {
        margin: 0;
        font-size: 13px;
        color: var(--text-secondary);
      }

      /* Hub grid (Data & Sistem style page) */
      .hub-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 14px;
      }
      .hub-card {
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: 12px;
        padding: 18px;
        cursor: pointer;
        transition:
          transform 0.12s,
          box-shadow 0.12s,
          border-color 0.12s;
      }
      .hub-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(38, 34, 28, 0.07);
        border-color: var(--accent-border);
      }
      .hub-card.active {
        border-color: var(--accent-border);
        background: var(--accent-bg);
      }
      .hub-card .icon {
        width: 42px;
        height: 42px;
        border-radius: 11px;
        background: var(--card);
        border: 0.5px solid var(--border);
        color: var(--accent-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        margin-bottom: 14px;
      }
      .hub-card.active .icon {
        background: var(--accent-text);
        color: #fff;
        border-color: var(--accent-text);
      }
      .hub-card h4 {
        margin: 0 0 5px;
        font-size: 14.5px;
        font-weight: 700;
      }
      .hub-card p {
        margin: 0;
        font-size: 12.5px;
        color: var(--text-secondary);
        line-height: 1.55;
      }
      .hub-card .go {
        margin-top: 12px;
        font-size: 12px;
        font-weight: 600;
        color: var(--accent-text);
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Generic placeholder page */
      .placeholder {
        background: var(--card);
        border: 0.5px solid var(--border);
        border-radius: 14px;
        padding: 40px 24px;
        text-align: center;
      }
      .placeholder .icon {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        background: var(--accent-bg);
        color: var(--accent-text);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 26px;
        margin: 0 auto 16px;
      }
      .placeholder h3 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .placeholder p {
        margin: 0 auto 22px;
        font-size: 13px;
        color: var(--text-secondary);
        max-width: 360px;
        line-height: 1.6;
      }
      .skeleton {
        max-width: 460px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .skeleton .bar {
        height: 11px;
        border-radius: 6px;
        background: #efede6;
      }
      .skeleton .bar:nth-child(1) {
        width: 92%;
      }
      .skeleton .bar:nth-child(2) {
        width: 100%;
      }
      .skeleton .bar:nth-child(3) {
        width: 76%;
      }

      /* Dev note */
      .devnote {
        margin: 4px 24px 24px;
        padding: 14px 16px;
        border: 1px dashed var(--border-strong);
        border-radius: 10px;
        background: #fff;
        font-size: 12.5px;
        color: var(--text-secondary);
      }
      .devnote .title {
        font-size: 11.5px;
        font-weight: 700;
        color: var(--text-primary);
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 8px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .devnote ul {
        margin: 0;
        padding-left: 18px;
      }
      .devnote li {
        margin-bottom: 5px;
        line-height: 1.55;
      }
      .devnote li:last-child {
        margin-bottom: 0;
      }

      @media (max-width: 860px) {
        :root {
          --sidebar-w: 230px;
        }
        .content {
          padding: 18px;
        }
        .devnote {
          margin: 4px 18px 18px;
        }
      }
    </style>
  </head>
  <body>

        <div class="sidebar-brand">

        <div class="devnote">
          <div class="title"><i class="ti ti-notes"></i> Catatan implementasi</div>
          <ul id="notes-list"></ul>
        </div>
      </div>
    </div>

            { name: "Master data", items: ["Data guru dan staff", "Data kelas", "Data siswa"] },
            { name: "Perpustakaan", items: ["Katalog buku", "Peminjaman", "Pengembalian"] },
          ],
          notes: [

            "Celah lama (E-Raport ikut nongol buat role ini) udah kefix — sekarang whitelist E-Raport eksplisit cuma isTeacher/isWaliKelas.",
          ],

          notes: [

            "E-Raport juga udah gak nyasar ke Siswa lagi karena whitelist eksplisit isTeacher/isWaliKelas.",
            "Sidebar Siswa sekarang cuma Profile Saya & Dashboard.",

      // Deskripsi singkat buat kartu grid "Data & Sistem" (fallback generik kalau item belum kemapping)
      const hubDescriptions = {
        "manajemen data": "Kelola SPMB, backup data, dan modul data terpusat lainnya.",
        "administrasi tu": "Surat menyurat, arsip, dan administrasi tata usaha.",
        "monitor sistem": "Log aktivitas, status server, dan kesehatan sistem aplikasi.",
      };

      const tabsEl = document.getElementById("role-tabs");
      const listEl = document.getElementById("sidebar-list");
      const notesEl = document.getElementById("notes-list");
      const contentEl = document.getElementById("content-area");
      const crumbGroupEl = document.getElementById("crumb-group");
      const crumbItemEl = document.getElementById("crumb-item");
      const brandSubEl = document.getElementById("brand-sub");
      const roleAvatarEl = document.getElementById("role-avatar");
      const roleFooterLabelEl = document.getElementById("role-footer-label");

      let active = "admin";
      let activeGroup = null;
      let activeItem = null;

      function iconForGroup(name) {
        const g = name.toLowerCase();
        if (g.includes("main")) return "ti-home";
        if (g.includes("master")) return "ti-database";
        if (g.includes("akademik")) return "ti-school";
        if (g.includes("data & sistem")) return "ti-adjustments";
        if (g.includes("kurikulum")) return "ti-clipboard-list";
        if (g.includes("perpus")) return "ti-books";
        return "ti-folder";
      }
      function iconForItem(name) {
        const n = name.toLowerCase();
        if (n.includes("profile")) return "ti-user-circle";
        if (n.includes("dashboard")) return "ti-layout-dashboard";
        if (n.includes("guru dan staff")) return "ti-users";
        if (n.includes("kelas")) return "ti-door";
        if (n.includes("siswa induk")) return "ti-users-group";
        if (n.includes("siswa")) return "ti-school";
        if (n.includes("presensi")) return "ti-calendar-check";
        if (n.includes("nilai")) return "ti-chart-bar";
        if (n.includes("jadwal")) return "ti-calendar-time";
        if (n.includes("jurnal")) return "ti-notebook";
        if (n.includes("laporan")) return "ti-file-report";
        if (n.includes("portal")) return "ti-door-enter";
        if (n.includes("manajemen data")) return "ti-grid-dots";
        if (n.includes("administrasi tu")) return "ti-briefcase";
        if (n.includes("monitor sistem")) return "ti-activity";
        if (n.includes("konseling")) return "ti-message-heart";
        if (n.includes("home visit")) return "ti-home-check";
        if (n.includes("katalog")) return "ti-books";
        if (n.includes("peminjaman")) return "ti-arrow-up-right";
        if (n.includes("pengembalian")) return "ti-arrow-back";
        if (n.includes("spmb")) return "ti-user-plus";
        if (n.includes("pengaturan")) return "ti-settings";
        if (n.includes("administrasi")) return "ti-briefcase";
        return "ti-point";
      }
      function initials(label) {
        return label
          .replace(/\+.*/, "")
          .trim()
          .split(/\s+/)
          .slice(0, 2)
          .map((w) => w[0])
          .join("")
          .toUpperCase();
      }

      function setActiveItem(groupName, itemName) {
        activeGroup = groupName;
        activeItem = itemName;
        render();
      }

      function renderSidebar(role) {
        listEl.innerHTML = "";
        role.groups.forEach((group) => {
          const head = document.createElement("div");
          head.className = "group-head";
          head.innerHTML =
            '<i class="ti ' + iconForGroup(group.name) + '"></i><span>' + group.name + "</span>";
          listEl.appendChild(head);

          group.items.forEach((item) => {
            const isPlus = item.startsWith("+");
            const isPlan = item.startsWith("~");
            const clean = item.replace(/^\+ /, "").replace(/^~ /, "");
            const isActive = activeGroup === group.name && activeItem === clean;

            const row = document.createElement("div");
            row.className =
              "item-row" + (isPlus || isPlan ? " plus" : "") + (isActive ? " active" : "");
            const badge = isPlan
              ? '<span class="badge badge-plan">rencana</span>'
              : isPlus
                ? '<span class="badge badge-new">baru</span>'
                : "";
            row.innerHTML =
              '<i class="ti ' + iconForItem(clean) + '"></i><span>' + clean + "</span>" + badge;
            row.onclick = () => setActiveItem(group.name, clean);
            listEl.appendChild(row);
          });
        });
      }

      function renderContent(role) {
        crumbGroupEl.textContent = role.label;
        crumbItemEl.textContent = (activeGroup ? activeGroup + " · " : "") + activeItem;

        if (activeGroup === "Data & Sistem") {
          const group = role.groups.find((g) => g.name === "Data & Sistem");
          contentEl.innerHTML = "";

          const head = document.createElement("div");
          head.className = "page-head";
          head.innerHTML =
            "<h2>Data & Sistem</h2><p>Hub modul administratif — pilih salah satu untuk membuka halamannya.</p>";
          contentEl.appendChild(head);

          const grid = document.createElement("div");
          grid.className = "hub-grid";
          group.items.forEach((item) => {
            const clean = item.replace(/^\+ /, "").replace(/^~ /, "");
            const desc =
              hubDescriptions[clean.toLowerCase()] ||
              "Kelola dan pantau modul ini dari satu tempat.";
            const isActive = activeItem === clean;
            const card = document.createElement("div");
            card.className = "hub-card" + (isActive ? " active" : "");
            card.innerHTML =
              '<div class="icon"><i class="ti ' +
              iconForItem(clean) +
              '"></i></div><h4>' +
              clean +
              "</h4><p>" +
              desc +
              '</p><div class="go">Buka halaman <i class="ti ti-arrow-right"></i></div>';
            card.onclick = () => setActiveItem("Data & Sistem", clean);
            grid.appendChild(card);
          });
          contentEl.appendChild(grid);
        } else {
          contentEl.innerHTML =
            '<div class="page-head"><h2>' +
            activeItem +
            "</h2><p>" +
            activeGroup +
            '</p></div><div class="placeholder"><div class="icon"><i class="ti ' +
            iconForItem(activeItem) +
            '"></i></div><h3>Preview navigasi</h3><p>Ini cuma mockup sidebar & routing, isi halaman "' +
            activeItem +
            '" belum digambar di sini.</p><div class="skeleton"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div></div>';
        }
      }

      function renderNotes(role) {
        notesEl.innerHTML = "";
        if (role.notes.length) {
          role.notes.forEach((n) => {
            const li = document.createElement("li");
            li.textContent = n;
            notesEl.appendChild(li);
          });
        } else {
          const li = document.createElement("li");
          li.textContent = "Tidak ada catatan anomali untuk role ini.";
          notesEl.appendChild(li);
        }
      }

      function render() {
        // Role tabs (topbar)
        tabsEl.innerHTML = "";
        Object.keys(data).forEach((key) => {
          const btn = document.createElement("button");
          btn.textContent = data[key].label;
          if (key === active) btn.classList.add("active");
          btn.onclick = () => {
            active = key;
            const firstGroup = data[active].groups[0];
            activeGroup = firstGroup.name;
            activeItem = firstGroup.items[0].replace(/^\+ /, "").replace(/^~ /, "");
            render();
          };
          tabsEl.appendChild(btn);
        });

        const role = data[active];

        // Default active item when switching role / first load
        if (activeGroup === null || !role.groups.some((g) => g.name === activeGroup)) {
          const firstGroup = role.groups[0];
          activeGroup = firstGroup.name;
          activeItem = firstGroup.items[0].replace(/^\+ /, "").replace(/^~ /, "");
        }

        brandSubEl.textContent = role.label + " — preview";
        roleAvatarEl.textContent = initials(role.label);
        roleFooterLabelEl.textContent = role.label;

        renderSidebar(role);
        renderContent(role);
        renderNotes(role);
      }

      render();
    </script>
  </body>
</html>
